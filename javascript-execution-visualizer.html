<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>JavaScript Execution Visualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/javascript-execution-visualizer.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <section class="panel">
                    <div class="toolbar"><select id="scenario" class="select"></select><button id="exec-back"
                            class="btn">← Back</button><button id="exec-next" class="btn btn-primary">Next
                            →</button><button id="exec-play" class="btn">Play</button><button id="exec-reset"
                            class="btn">Reset</button></div>
                </section>
                <div class="runtime-grid">
                    <section class="panel">
                        <h3>Call stack</h3>
                        <div id="call-stack" class="runtime-lane"></div>
                    </section>
                    <section class="panel">
                        <h3>Web APIs</h3>
                        <div id="web-apis" class="runtime-lane"></div>
                    </section>
                    <section class="panel">
                        <h3>Microtask queue</h3>
                        <div id="microtasks" class="runtime-lane"></div>
                    </section>
                    <section class="panel">
                        <h3>Callback queue</h3>
                        <div id="callbacks" class="runtime-lane"></div>
                    </section>
                </div>
                <section class="panel">
                    <h2>Event-loop timeline</h2>
                    <div id="exec-timeline" class="flow"></div>
                    <p id="exec-explanation"></p>
                </section>
                <p class="help">Conceptual browser runtime model; this is not a real JavaScript engine.</p>
            </div>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/javascript-execution-visualizer.js"></script>
</body>

</html>
