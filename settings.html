<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <form id="settings-form" class="grid grid-2">
                    <section class="panel">
                        <h2>Brand & theme</h2>
                        <div id="theme-settings" class="settings-grid"></div>
                    </section>
                    <section class="panel">
                        <h2>Layout & motion</h2>
                        <div id="layout-settings" class="settings-grid"></div>
                    </section>
                    <section class="panel preview">
                        <h2>Live preview</h2>
                        <div class="preview-card"><span class="badge">Preview</span>
                            <h3>Engineering workspace</h3>
                            <p class="muted">Theme tokens apply across every module.</p><button class="btn btn-primary"
                                type="button">Primary action</button>
                        </div>
                    </section>
                    <section class="panel">
                        <h2>Workspace data</h2>
                        <div class="toolbar"><button id="save-settings" class="btn btn-primary">Save
                                settings</button><button id="reset-theme" type="button" class="btn">Reset
                                theme</button><button id="reset-layout" type="button" class="btn">Reset
                                layout</button><button id="export-workspace" type="button"
                                class="btn">Export</button><label class="btn">Import<input id="import-workspace"
                                    type="file" accept=".json" hidden></label><button id="reset-demo" type="button"
                                class="btn">Reset demo data</button><button id="clear-workspace" type="button"
                                class="btn btn-danger">Clear localStorage</button></div>
                    </section>
                </form>
            </div>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
