<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>OOP Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/oop-playground.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <section class="panel">
                    <div class="toolbar"><button id="create-class" class="btn btn-primary">Create class</button><button
                            id="create-instance" class="btn">Create instance</button><select id="oop-demo"
                            class="select"></select></div>
                </section>
                <div class="grid grid-2">
                    <section class="panel">
                        <h2>Class model</h2>
                        <div id="class-model" class="class-grid"></div>
                    </section>
                    <section class="panel">
                        <h2>Instances & method resolution</h2>
                        <div id="instance-model" class="list"></div>
                    </section>
                </div>
                <section class="panel">
                    <h2>Prototype chain</h2>
                    <div id="prototype-chain" class="flow"></div>
                </section>
                <p class="help">This playground models class relationships and method lookup; it does not execute
                    uploaded or arbitrary JavaScript.</p>
            </div>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/oop-playground.js"></script>
</body>

</html>
