<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SQL Analytics Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/sql-analytics.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <section class="panel">
                    <div class="toolbar"><select id="dataset" class="select"></select><label class="btn">Import
                            CSV/JSON<input id="analytics-import" type="file" accept=".csv,.json" hidden></label><select
                            id="group-field" class="select"></select><select id="value-field"
                            class="select"></select><select id="aggregate" class="select">
                            <option>sum</option>
                            <option>average</option>
                            <option>count</option>
                            <option>min</option>
                            <option>max</option>
                        </select><button id="apply-analytics" class="btn btn-primary">Build report</button><button
                            id="export-csv" class="btn">CSV</button><button id="export-json" class="btn">JSON</button>
                    </div>
                </section>
                <div id="analytics-stats" class="grid grid-4"></div>
                <div class="grid grid-2">
                    <section class="panel chart-panel"><canvas id="analytics-chart"></canvas></section>
                    <section class="panel">
                        <h2>Grouped results</h2>
                        <div id="analytics-table"></div>
                    </section>
                </div>
                <section class="panel">
                    <h2>Source rows</h2>
                    <div id="source-table"></div>
                </section>
            </div>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/sql-analytics.js"></script>
</body>

</html>
