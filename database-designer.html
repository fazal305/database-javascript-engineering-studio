<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Database Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/database-designer.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <section class="panel">
                    <div class="toolbar"><button id="add-table" class="btn btn-primary">Add table</button><button
                            id="add-relationship" class="btn">Connect tables</button><button id="zoom-in"
                            class="btn">Zoom +</button><button id="zoom-out" class="btn">Zoom −</button><button
                            id="export-schema-sql" class="btn">Export SQL</button><button id="export-schema-json"
                            class="btn">Export JSON</button><label class="btn">Import JSON<input id="import-schema-json"
                                type="file" accept=".json" hidden></label><label class="btn">Import SQL<input
                                id="import-schema-sql" type="file" accept=".sql,.txt" hidden></label></div>
                </section>
                <section id="designer-canvas" class="workspace-canvas" tabindex="0"><svg id="relationship-layer"
                        aria-label="Table relationships"></svg>
                    <div id="table-layer"></div>
                </section>
                <p class="help">Drag tables to rearrange them. Double-click a table to add a column. Changes are saved
                    after meaningful actions.</p>
            </div>
        </main>
    </div>
    <dialog id="designer-dialog">
        <form method="dialog" class="panel dialog-form">
            <h2 id="dialog-title">Edit</h2>
            <div id="dialog-fields"></div>
            <div class="toolbar"><button value="cancel" class="btn">Cancel</button><button id="dialog-save"
                    value="default" class="btn btn-primary">Save</button></div>
        </form>
    </dialog>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/database-designer.js"></script>
</body>

</html>
