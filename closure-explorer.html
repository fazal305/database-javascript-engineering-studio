<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Closure Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/closure-explorer.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <section class="panel">
                    <div class="toolbar"><select id="closure-scenario" class="select"></select><button id="new-closure"
                            class="btn btn-primary">Create closure</button><button id="invoke-closure"
                            class="btn">Invoke selected</button><button id="reset-closures" class="btn">Reset</button>
                    </div>
                </section>
                <div class="grid grid-3">
                    <section class="panel scope outer">
                        <h3>Outer lexical scope</h3>
                        <div id="outer-scope"></div>
                    </section>
                    <section class="panel scope retained">
                        <h3>Retained environment</h3>
                        <div id="retained-scope"></div>
                    </section>
                    <section class="panel scope inner">
                        <h3>Closure instances</h3>
                        <div id="closure-instances" class="list"></div>
                    </section>
                </div>
                <section class="panel">
                    <h2>Invocation timeline</h2>
                    <div id="closure-timeline" class="flow"></div>
                </section>
            </div>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/closure-explorer.js"></script>
</body>

</html>
