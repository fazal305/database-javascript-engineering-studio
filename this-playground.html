<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>this Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/this-playground.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <div class="grid grid-2">
                    <section class="panel">
                        <h2>Invocation scenario</h2><select id="this-scenario" class="select"></select>
                        <pre id="this-code" class="code-block"></pre><button id="run-this"
                            class="btn btn-primary">Resolve this</button>
                    </section>
                    <section class="panel">
                        <h2>Binding result</h2>
                        <div id="this-result" class="binding-result"></div>
                        <h3>Decision path</h3>
                        <div id="this-path" class="flow"></div>
                    </section>
                </div>
                <section class="panel">
                    <h2>Rule comparison</h2>
                    <div id="this-rules" class="table-wrap"></div>
                </section>
            </div>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/this-playground.js"></script>
</body>

</html>
