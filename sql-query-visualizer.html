<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SQL Query Visualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/sql-query-visualizer.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <section class="panel"><textarea id="visualizer-sql" class="textarea code-editor"></textarea>
                    <div class="toolbar"><button id="build-plan" class="btn btn-primary">Build plan</button><button
                            id="step-back" class="btn">← Back</button><button id="step-next" class="btn">Next
                            →</button><button id="play-plan" class="btn">Play</button><button id="reset-plan"
                            class="btn">Reset</button><label>Speed <input id="plan-speed" type="range" min="150"
                                max="1500" value="700"></label></div>
                </section>
                <section class="panel">
                    <h2>Execution plan</h2>
                    <div id="execution-plan" class="flow"></div>
                </section>
                <section class="grid grid-2">
                    <div class="panel">
                        <h3>Step explanation</h3>
                        <div id="step-explanation"></div>
                    </div>
                    <div class="panel">
                        <h3>Intermediate rows</h3>
                        <div id="intermediate-rows"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/mysql-workbench.js"></script>
    <script src="js/sql-query-visualizer.js"></script>
</body>

</html>
