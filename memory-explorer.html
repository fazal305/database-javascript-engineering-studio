<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Memory Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/memory-explorer.css">
</head>

<body>
    <div class="app-shell">
        <aside data-sidebar></aside>
        <main class="main">
            <header data-topbar></header>
            <div class="page-content">
                <section class="panel">
                    <div class="toolbar"><select id="memory-scenario" class="select"></select><button
                            id="add-memory-node" class="btn">Add object</button><button id="remove-reference"
                            class="btn">Remove root reference</button><button id="collect-garbage"
                            class="btn btn-primary">Calculate reachability</button></div>
                </section>
                <div class="memory-layout">
                    <section class="panel">
                        <h2>Stack roots</h2>
                        <div id="memory-stack" class="list"></div>
                    </section>
                    <section class="panel heap">
                        <h2>Heap graph</h2><svg id="memory-links"></svg>
                        <div id="memory-heap"></div>
                    </section>
                </div>
                <section class="panel">
                    <h2>Garbage candidates</h2>
                    <div id="garbage-candidates"></div>
                    <p class="help">Simplified tracing model. Modern collectors can reclaim unreachable cycles.</p>
                </section>
            </div>
        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/memory-explorer.js"></script>
</body>

</html>
